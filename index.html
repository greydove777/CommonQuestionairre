<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>症狀分診入口</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #888;
    --headache: #c0392b;
    --headache-light: #fdf0ef;
    --headache-border: #e8c5c2;
    --dizziness: #1a6b9a;
    --dizziness-light: #eef5fb;
    --dizziness-border: #b8d4e8;
    --insomnia: #5c3d8f;
    --insomnia-light: #f3eefb;
    --insomnia-border: #cdb8e8;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 20px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 入口頁 ── */
  #landing {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    animation: fadeUp 0.6s ease both;
  }

  .header-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .question-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .cards {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 680px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    flex: 1;
    min-width: 200px;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    text-align: center;
    box-shadow: var(--shadow);
    transition: all 0.25s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .card.headache { border-color: var(--headache-border); }
  .card.headache::before { background: var(--headache-light); }
  .card.headache:hover { border-color: var(--headache); transform: translateY(-4px); box-shadow: 0 12px 36px rgba(192,57,43,0.15); }
  .card.headache:hover::before { opacity: 1; }

  .card.dizziness { border-color: var(--dizziness-border); }
  .card.dizziness::before { background: var(--dizziness-light); }
  .card.dizziness:hover { border-color: var(--dizziness); transform: translateY(-4px); box-shadow: 0 12px 36px rgba(26,107,154,0.15); }
  .card.dizziness:hover::before { opacity: 1; }

  .card.insomnia { border-color: var(--insomnia-border); }
  .card.insomnia::before { background: var(--insomnia-light); }
  .card.insomnia:hover { border-color: var(--insomnia); transform: translateY(-4px); box-shadow: 0 12px 36px rgba(92,61,143,0.15); }
  .card.insomnia:hover::before { opacity: 1; }

  .card-emoji {
    font-size: 40px;
    margin-bottom: 12px;
    position: relative;
  }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
    position: relative;
  }

  .card.headache .card-title { color: var(--headache); }
  .card.dizziness .card-title { color: var(--dizziness); }
  .card.insomnia .card-title { color: var(--insomnia); }

  .card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    position: relative;
  }

  .card-arrow {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 99px;
    position: relative;
    transition: all 0.2s;
  }

  .card.headache .card-arrow { background: var(--headache); color: #fff; }
  .card.dizziness .card-arrow { background: var(--dizziness); color: #fff; }
  .card.insomnia .card-arrow { background: var(--insomnia); color: #fff; }

  .disclaimer {
    margin-top: 32px;
    font-size: 11px;
    color: #bbb;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }

  /* ── 動畫 ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .fade-in { animation: fadeIn 0.4s ease both; }
</style>
</head>
<body>

<!-- 入口選擇頁 -->
<div id="landing">
  <div class="header-icon">🏥</div>
  <h1>症狀快速分診</h1>
  <p class="subtitle">請選擇您目前最主要的不適症狀<br>系統將為您開啟對應的評估問卷</p>

  <p class="question-label">您目前的主要症狀是？</p>

  <div class="cards">
    <div class="card headache" onclick="openSurvey('headache')">
      <div class="card-emoji">🤕</div>
      <div class="card-title">頭痛</div>
      <div class="card-desc">局部或全頭脹痛<br>搏動感、壓迫感</div>
      <div class="card-arrow">前往填寫 →</div>
    </div>

    <div class="card dizziness" onclick="openSurvey('dizziness')">
      <div class="card-emoji">😵</div>
      <div class="card-title">頭暈</div>
      <div class="card-desc">天旋地轉、站不穩<br>頭重腳輕、飄浮感</div>
      <div class="card-arrow">前往填寫 →</div>
    </div>

    <div class="card insomnia" onclick="openSurvey('insomnia')">
      <div class="card-emoji">🌙</div>
      <div class="card-title">失眠</div>
      <div class="card-desc">難以入睡、易醒<br>睡眠品質差</div>
      <div class="card-arrow">前往填寫 →</div>
    </div>
  </div>

  <p class="disclaimer">⚠️ 若您出現劇烈頭痛、意識不清、肢體無力等緊急症狀，請立即告知醫護人員，勿自行填寫問卷。</p>
</div>

<script>
  const SURVEYS = {
    headache:  'https://www.surveycake.com/s/9qxe1',
    dizziness: 'https://docs.google.com/forms/d/1xVf7YKz2JR8-BW5WGjORoSUQFs8AohT1aCkIvFnw4Pg/viewform',
    insomnia:  'https://sleep.mentalwe.com/scale/sleep-pattern/',
  };

  function openSurvey(type) {
    window.open(SURVEYS[type], '_blank');
  }
</script>
</body>
</html>
